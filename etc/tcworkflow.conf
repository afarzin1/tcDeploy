# tcDeploy — SITE configuration: the build box and how to reach it.
# Sourced by every bin/tc* wrapper. Do not edit this file for your site: put
# your values in etc/tcworkflow.local.conf (untracked, read right after this
# one), or export them in the environment. Example tcworkflow.local.conf:
#
#   BUILD_HOST="buildbox.example.local"     # or its IP address
#   BUILD_USER="tcbuild"
#   BUILD_SSH_KEY="$HOME/.ssh/id_ed25519"
#
# PROJECT settings (solution, sync set, target PLC, guards) do NOT live here.
# They live in a tcdeploy.conf at the root of each TwinCAT repo; the wrappers
# find it by walking up from the current directory. See README, "Adding a project".

# --- Build box (Windows, TwinCAT XAE) ---
BUILD_HOST="${BUILD_HOST:-}"                     # required
BUILD_USER="${BUILD_USER:-tcbuild}"
BUILD_SSH_KEY="${BUILD_SSH_KEY:-$HOME/.ssh/id_rsa}"

# --- TwinCAT ---
TC_VERSION="${TC_VERSION:-4026.27}"

# Execution mode, decided by tools/smoketest.sh (design §7 step 1):
#   direct = SSH invokes build.ps1 straight away (network logon drives DTE fine)
#   worker = SSH drops a job file; the autologon-session worker executes it
# worker is what TwinCAT 4026 needs in practice: a Session 0 logon can open the
# DTE, but the TwinCAT project system does not initialise there.
TC_MODE="${TC_MODE:-worker}"

# --- Paths on the box ---
# Everything tcDeploy keeps on the box lives under one root: scripts\, queue\,
# out\, state\, tmp\, and projects\<PROJECT>\ -- one tree per project.
REMOTE_ROOT='C:\_tcDeploy'

# --- Timeouts (seconds) ---
JOB_TIMEOUT="${JOB_TIMEOUT:-900}"
POLL_INTERVAL="${POLL_INTERVAL:-2}"
